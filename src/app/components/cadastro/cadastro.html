<div class="flex min-h-[70vh] items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">

    <h1 class="mb-6 text-center text-3xl font-bold text-blue-700">SistemaRH</h1>
    <h2 class="mb-6 text-center text-xl font-semibold">Criar conta</h2>

    <form class="space-y-4">
      <div>
        <label for="nome" class="mb-1 block font-medium">Nome</label>
        <input id="nome" type="text" placeholder="Digite seu nome"
          class="w-full rounded-lg border border-gray-300 p-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <div>
        <label for="email" class="mb-1 block font-medium">E-mail</label>
        <input id="email" type="email" placeholder="Digite seu e-mail"
          class="w-full rounded-lg border border-gray-300 p-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <div>
        <label for="senha" class="mb-1 block font-medium">Senha</label>
        <input id="senha" type="password" placeholder="Digite sua senha"
          class="w-full rounded-lg border border-gray-300 p-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <div>
        <label for="confirmar-senha" class="mb-1 block font-medium">Confirmar senha</label>
        <input id="confirmar-senha" type="password" placeholder="Repita a senha"
          class="w-full rounded-lg border border-gray-300 p-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <button type="button"
        class="w-full rounded-lg bg-blue-600 p-3 font-semibold text-white hover:bg-blue-700">
        Cadastrar
      </button>
    </form>

    <p class="mt-6 text-center text-gray-600">
      Já possui uma conta?
      <a routerLink="/login" class="font-semibold text-blue-600 hover:underline">Entre</a>
    </p>

  </div>
</div>
